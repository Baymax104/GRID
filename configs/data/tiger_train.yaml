# @package _global_

dataset_class:
  _target_: src.data.datasets.SequenceDataset
  _partial_: true

train_label:
  sequence_data:
    transform:
      _target_: src.data.components.label_functions.NextKTokenMasking
      next_k: ${num_hierarchies}

eval_label:
  sequence_data:
    transform:
      _target_: src.data.components.label_functions.NextKTokenMasking
      next_k: ${num_hierarchies}

preprocessing_functions:
- _target_: src.data.components.preprocessing.filter_features_to_consider
  _partial_: true
  features_to_consider: [sequence_data]
- _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
  _partial_: true
- _target_: src.data.components.preprocessing.convert_fields_to_tensors
  _partial_: true
  field_type_map:
    sequence_data:
      _target_: torch.__dict__.get
      _args_:
      - int32
- _target_: src.data.components.preprocessing.map_sparse_id_to_semantic_id
  _partial_: true
  semantic_id_bundle:
    _target_: src.utils.tensor_utils.load_model_output
    file_path: ${semantic_id_path}
  features_to_apply: [sequence_data]
  num_hierarchies: ${num_hierarchies}

train_collate:
  _target_: src.data.components.collate.collate_with_sid_causal_duplicate
  _partial_: true
  sequence_field_name: sequence_data
  sid_hierarchy: ${num_hierarchies}
  labels: ${data.train_label}
  sequence_length: ${sequence_length}
  masking_token: 0
  padding_token: -1
  max_batch_size: 32

eval_collate:
  _target_: src.data.components.collate.collate_fn_train
  _partial_: true
  labels: ${data.eval_label}
  sequence_length: ${sequence_length}
  masking_token: 0
  padding_token: -1

train_dataset_config:
  _target_: src.data.components.config_models.SemanticIDDatasetConfig
  data_reader:
    _target_: src.data.components.readers.TFRecordReader
    _partial_: true
    shuffle_rows: true
  shuffle_files: true
  preprocessing_functions: ${data.preprocessing_functions}

eval_dataset_config:
  _target_: src.data.components.config_models.SemanticIDDatasetConfig
  data_reader:
    _target_: src.data.components.readers.TFRecordReader
    _partial_: true
    shuffle_rows: false
  shuffle_files: false
  preprocessing_functions: ${data.preprocessing_functions}

train_dataloader:
  _target_: src.data.components.config_models.SequenceDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/training
  batch_size_per_device: 32
  num_workers: 16
  timeout: 60
  assign_files_by_size: false
  drop_last: true
  persistent_workers: true
  collate_fn: ${data.train_collate}
  dataset_config: ${data.train_dataset_config}
  pin_memory: true

val_dataloader:
  _target_: src.data.components.config_models.SequenceDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/evaluation
  batch_size_per_device: 8
  num_workers: 8
  timeout: 60
  assign_files_by_size: true
  drop_last: false
  persistent_workers: false
  collate_fn: ${data.eval_collate}
  dataset_config: ${data.eval_dataset_config}
  pin_memory: false

test_dataloader:
  _target_: src.data.components.config_models.SequenceDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/testing
  batch_size_per_device: 8
  num_workers: 8
  timeout: 60
  assign_files_by_size: true
  drop_last: false
  persistent_workers: false
  collate_fn: ${data.eval_collate}
  dataset_config: ${data.eval_dataset_config}
  pin_memory: false

datamodule:
  _target_: src.data.data_module.BaseDataModule
  train_dataloader_config: ${data.train_dataloader}
  val_dataloader_config: ${data.val_dataloader}
  test_dataloader_config: ${data.test_dataloader}

# @package _global_

data_iterator:
  _target_: src.data.components.iterators.TFRecordIterator
dataset_class:
  _target_: src.data.components.datasets.SequenceDataset
  _partial_: true
collate:
  _target_: src.data.components.collate.collate_fn_items
  _partial_: true
  item_id_field: ${data.dataset.item_id_field}
  feature_to_input_name: ${data.predict_dataloader.feature_to_input_name}
preprocessing:
  filter_features:
    _target_: src.data.components.preprocessing.filter_features_to_consider
    _partial_: true
  dense_array:
    _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
    _partial_: true
  convert_fields:
    _target_: src.data.components.preprocessing.convert_fields_to_tensors
    _partial_: true
  sparse_to_embedding:
    _target_: src.data.components.preprocessing.map_sparse_id_to_embedding
    _partial_: true
    sparse_id_field: id
    embedding_field_to_add: embedding
dataset:
  _target_: src.data.components.config_models.ItemDatasetConfig
  item_id_field: id
  keep_item_id: true
  data_iterator: ${data.data_iterator}
  features_to_consider: ${extract_fields_from_list_of_dicts:${data.features},
    "name", False, "is_item_ids", "True"}
  embedding_map:
    id: ${data.features[0].embeddings}
  num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data.features},
    "name", "num_placeholder_tokens"}
  preprocessing_functions:
  - ${data.preprocessing.filter_features}
  - ${data.preprocessing.dense_array}
  - ${data.preprocessing.convert_fields}
  - ${data.preprocessing.sparse_to_embedding}
  field_type_map: ${create_map_from_list_of_dicts:${data.features}, "name",
    "type"}
predict_dataloader:
  _target_: src.data.components.config_models.ItemDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/items
  should_shuffle_rows: false
  batch_size_per_device: 128
  num_workers: 2
  assign_files_by_size: true
  timeout: 60
  drop_last: false
  pin_memory: false
  persistent_workers: true
  collate_fn: ${data.collate}
  dataset_config: ${data.dataset}
  limit_files: null
  feature_to_input_name:
    id: item_ids
    text: text_tokens
    text_mask: text_mask
    embedding: input_embedding
datamodule:
  _target_: src.data.datamodules.item.ItemDataModule
  predict_dataloader_config: ${data.predict_dataloader}
features:
- name: id
  num_placeholder_tokens: 0
  is_item_ids: true
  embeddings:
    _target_: src.utils.tensor_utils.load_keyed_prediction_bundle
    file_path: ${embedding_path}
  type:
    _target_: torch.__dict__.get
    _args_:
    - int32

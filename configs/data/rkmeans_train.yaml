# @package _global_

dataset_class:
  _target_: src.data.components.datasets.SequenceDataset
  _partial_: true

collate:
  _target_: src.data.components.collate.collate_fn_items
  _partial_: true
  item_id_field: id
  feature_to_input_name:
    id: item_ids
    text: text_tokens
    text_mask: text_mask
    embedding: input_embedding

preprocessing_functions:
  - _target_: src.data.components.preprocessing.filter_features_to_consider
    _partial_: true
    features_to_consider: [id]
  - _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
    _partial_: true
  - _target_: src.data.components.preprocessing.convert_fields_to_tensors
    _partial_: true
    field_type_map:
      id:
        _target_: torch.__dict__.get
        _args_:
          - int32
  - _target_: src.data.components.preprocessing.map_sparse_id_to_embedding
    _partial_: true
    embedding_bundle:
      _target_: src.utils.tensor_utils.load_model_output
      file_path: ${embedding_path}
    sparse_id_field: id
    embedding_field_to_add: embedding

train_dataset_config:
  _target_: src.data.components.config_models.ItemDatasetConfig
  shuffle_files: true
  data_reader:
    _target_: src.data.components.readers.TFRecordReader
    _partial_: true
    shuffle_rows: true
  preprocessing_functions: ${data.preprocessing_functions}

eval_dataset_config:
  _target_: src.data.components.config_models.ItemDatasetConfig
  shuffle_files: false
  data_reader:
    _target_: src.data.components.readers.TFRecordReader
    _partial_: true
    shuffle_rows: false
  preprocessing_functions: ${data.preprocessing_functions}

train_dataloader:
  _target_: src.data.components.config_models.ItemDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/items
  batch_size_per_device: 2048
  num_workers: 12
  assign_files_by_size: false
  timeout: 60
  drop_last: false
  pin_memory: true
  persistent_workers: true
  collate_fn: ${data.collate}
  dataset_config: ${data.train_dataset_config}
  limit_files: null

val_dataloader:
  _target_: src.data.components.config_models.ItemDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/items
  batch_size_per_device: 256
  num_workers: 2
  assign_files_by_size: true
  timeout: 60
  drop_last: false
  pin_memory: false
  persistent_workers: true
  collate_fn: ${data.collate}
  dataset_config: ${data.eval_dataset_config}
  limit_files: null

test_dataloader:
  _target_: src.data.components.config_models.ItemDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/items
  batch_size_per_device: 256
  num_workers: 2
  assign_files_by_size: true
  timeout: 60
  drop_last: false
  pin_memory: false
  persistent_workers: true
  collate_fn: ${data.collate}
  dataset_config: ${data.eval_dataset_config}
  limit_files: null

datamodule:
  _target_: src.data.datamodules.item.ItemDataModule
  train_dataloader_config: ${data.train_dataloader}
  val_dataloader_config: ${data.val_dataloader}
  test_dataloader_config: ${data.test_dataloader}

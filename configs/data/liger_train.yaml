# @package _global_
defaults:
- tiger_train@_here_
- _self_
train_dataloader:
  batch_size_per_device: 256
  num_workers: 4
val_dataloader:
  batch_size_per_device: 32
  num_workers: 4
test_dataloader:
  batch_size_per_device: 32
  num_workers: 4

train_preprocessing_functions:
- _target_: src.data.components.preprocessing.filter_features_to_consider
  _partial_: true
  features_to_consider:
  - sequence_data
- _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
  _partial_: true
- _target_: src.data.components.preprocessing.convert_fields_to_tensors
  _partial_: true
  field_type_map:
    sequence_data:
      _target_: torch.__dict__.get
      _args_:
      - int32
- _target_: src.data.components.preprocessing.map_sparse_id_to_semantic_id
  _partial_: true
  semantic_id_bundle:
    _target_: src.data.components.artifacts.load_model_output
    file_path: ${semantic_id_path}
    field_name: semantic_id_path
    wandb_entity: ${user}
    wandb_project: ${project}
  features_to_apply:
  - sequence_data
  num_hierarchies: ${num_hierarchies}
- _target_: src.data.components.preprocessing.expand_sid_causal_duplicate_sequences
  _partial_: true
  sequence_field_name: sequence_data
  sid_hierarchy: ${num_hierarchies}
  max_num_sequences: 32
- _target_: src.data.components.liger.generate_liger_next_item
  _partial_: true
  sequence_field_name: sequence_data
  input_field_name: input_ids
  target_field_name: target_ids
  next_k: ${num_hierarchies}
- _target_: src.data.components.preprocessing.normalize_sequence
  _partial_: true
  input_field_name: input_ids
  attention_mask_field_name: attention_mask
  sequence_length: ${sequence_length}
  sid_hierarchy: ${num_hierarchies}
  padding_token: -1
eval_preprocessing_functions:
- _target_: src.data.components.preprocessing.filter_features_to_consider
  _partial_: true
  features_to_consider:
  - sequence_data
- _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
  _partial_: true
- _target_: src.data.components.preprocessing.convert_fields_to_tensors
  _partial_: true
  field_type_map:
    sequence_data:
      _target_: torch.__dict__.get
      _args_:
      - int32
- _target_: src.data.components.preprocessing.map_sparse_id_to_semantic_id
  _partial_: true
  semantic_id_bundle:
    _target_: src.data.components.artifacts.load_model_output
    file_path: ${semantic_id_path}
    field_name: semantic_id_path
    wandb_entity: ${user}
    wandb_project: ${project}
  features_to_apply:
  - sequence_data
  num_hierarchies: ${num_hierarchies}
- _target_: src.data.components.liger.generate_liger_next_item
  _partial_: true
  sequence_field_name: sequence_data
  input_field_name: input_ids
  target_field_name: target_ids
  next_k: ${num_hierarchies}
- _target_: src.data.components.preprocessing.normalize_sequence
  _partial_: true
  input_field_name: input_ids
  attention_mask_field_name: attention_mask
  sequence_length: ${sequence_length}
  sid_hierarchy: ${num_hierarchies}
  padding_token: -1

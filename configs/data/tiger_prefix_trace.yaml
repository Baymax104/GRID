# @package _global_

dataset_class:
  _target_: src.data.datasets.SequenceDataset
  _partial_: true
preprocessing_functions:
- _target_: src.data.components.preprocessing.filter_features_to_consider
  _partial_: true
  features_to_consider: [sequence_data, user_id]
- _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
  _partial_: true
- _target_: src.data.components.preprocessing.convert_fields_to_tensors
  _partial_: true
  field_type_map:
    sequence_data:
      _target_: torch.__dict__.get
      _args_: [int32]
    user_id:
      _target_: torch.__dict__.get
      _args_: [int32]
- _target_: src.data.components.preprocessing.map_sparse_id_to_semantic_id
  _partial_: true
  semantic_id_bundle:
    _target_: src.data.components.artifacts.load_model_output
    file_path: ${semantic_id_path}
    field_name: semantic_id_path
    wandb_entity: ${user}
    wandb_project: ${project}
  features_to_apply: [sequence_data]
  num_hierarchies: ${model.root.num_hierarchies}
- _target_: src.data.components.preprocessing.generate_next_k_labels
  _partial_: true
  sequence_field_name: sequence_data
  input_field_name: input_ids
  target_field_name: target_ids
  next_k: ${model.root.num_hierarchies}
  masking_token: 0
  padding_token: -1
- _target_: src.data.components.preprocessing.normalize_sequence
  _partial_: true
  input_field_name: input_ids
  attention_mask_field_name: attention_mask
  sequence_length: ${sequence_length}
  sid_hierarchy: ${model.root.num_hierarchies}
  padding_token: -1
collate:
  _target_: src.data.components.collate.collate_fn_sequence
  _partial_: true
  input_field_name: input_ids
  attention_mask_field_name: attention_mask
  target_field_name: target_ids
  output_key_field_name: user_id
predict_dataset_config:
  _target_: src.common.configs.data.DatasetConfig
  data_reader:
    _target_: src.data.components.readers.TFRecordReader
    _partial_: true
    shuffle_rows: false
  shuffle_files: false
  preprocessing_functions: ${data.preprocessing_functions}
predict_dataloader:
  _target_: src.common.configs.data.SequenceDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/${data_split}
  batch_size_per_device: 32
  num_workers: 8
  timeout: 60
  assign_files_by_size: true
  drop_last: false
  persistent_workers: false
  collate_fn: ${data.collate}
  dataset_config: ${data.predict_dataset_config}
  pin_memory: false
datamodule:
  _target_: src.data.datamodule.tiger_trace.TigerTraceDataModule
  _recursive_: false
  data_split: ${data_split}
  predict_dataloader_config: ${data.predict_dataloader}

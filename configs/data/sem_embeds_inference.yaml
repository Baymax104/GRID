# @package _global_

dataset_class:
  _target_: src.data.components.datasets.SequenceDataset
  _partial_: true

collate:
  _target_: src.data.components.collate.collate_fn_items
  _partial_: true
  item_id_field: id
  feature_to_input_name:
    id: item_ids
    text: text_tokens
    text_mask: text_mask
    embedding: input_embedding

preprocessing_functions:
  - _target_: src.data.components.preprocessing.filter_features_to_consider
    _partial_: true
    features_to_consider: [id, text]
  - _target_: src.data.components.preprocessing.convert_to_dense_numpy_array
    _partial_: true
    features_to_apply:
      - id
      - text
  - _target_: src.data.components.preprocessing.squeeze_tensor_in_place
    _partial_: true
    features_to_apply:
      - text
  - _target_: src.data.components.preprocessing.convert_fields_to_tensors
    _partial_: true
    features_to_apply:
      - id
    field_type_map:
      id:
        _target_: torch.__dict__.get
        _args_:
          - int32
  - _target_: src.data.components.preprocessing.convert_bytes_to_string
    _partial_: true
    features_to_apply:
      - text
  - _target_: src.data.components.preprocessing.tokenize_text_features
    _partial_: true
    features_to_apply:
      - text
    tokenizer_config: ${data.tokenizer}
  - _target_: src.data.components.preprocessing.squeeze_tensor_in_place
    _partial_: true
    features_to_apply:
      - text
      - text_mask

predict_dataset_config:
  _target_: src.data.components.config_models.ItemDatasetConfig
  shuffle_files: false
  preprocessing_functions: ${data.preprocessing_functions}
  data_reader:
    _target_: src.data.components.readers.TFRecordReader
    _partial_: true
    shuffle_rows: false

predict_dataloader:
  _target_: src.data.components.config_models.ItemDataloaderConfig
  dataset_class: ${data.dataset_class}
  data_folder: ${paths.data_dir}/items
  batch_size_per_device: 8
  num_workers: 2
  assign_files_by_size: true
  timeout: 60
  drop_last: false
  pin_memory: false
  persistent_workers: true
  collate_fn: ${data.collate}
  dataset_config: ${data.predict_dataset_config}
  limit_files: null


datamodule:
  _target_: src.data.datamodules.item.ItemDataModule
  predict_dataloader_config: ${data.predict_dataloader}

tokenizer:
  max_length: 128
  padding: max_length
  truncation: true
  add_special_tokens: true
  tokenizer:
    _target_: transformers.AutoTokenizer.from_pretrained
    pretrained_model_name_or_path: ${embedding_model}

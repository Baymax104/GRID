wandb_artifact_writer:
  _target_: src.common.writers.wandb_artifact_writer.WandbArtifactWriter
  output_dir: ${paths.output_dir}/wandb_artifact
  flush_frequency: 100000
  post_processing_functions:
  - _target_: src.common.writers.postprocessing.deduplicate_rows_in_tensor
    _partial_: true
  artifact_name: ${task_name}-semantic-id
  artifact_type: semantic_id
  role: semantic_id
  task_name: ${task_name}
  aliases:
  - latest
wandb_artifact_lineage:
  _target_: src.common.callbacks.wandb_artifact_lineage.WandbArtifactLineageCallback
  fail_on_missing_run: false
  clear_after_recording: true

# @package _global_
calibration_writer:
  _target_: src.common.writers.AuxiliaryTensorWriter
  output_dir: ${paths.output_dir}/item_resolution_calibration
  payload_name: item_resolution_calibration
  output_filename: item_resolution_calibration.pt
  flush_frequency: 1024
  publish_wandb: true
  artifact_name: ${task_name}-calibration
  artifact_type: item_resolution_calibration
  role: item_resolution_calibration
  aliases: [latest]
  validator:
    _target_: src.data.components.item_resolution.validate_resolution_calibration
    _partial_: true
  metadata:
    task_name: ${task_name}

wandb_artifact_lineage:
  _target_: src.common.callbacks.wandb_artifact_lineage.WandbArtifactLineageCallback
  fail_on_missing_run: false
  clear_after_recording: true

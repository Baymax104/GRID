# @package _global_
model_checkpoint:
  _target_: lightning.pytorch.callbacks.ModelCheckpoint
  dirpath: ${paths.output_dir}/checkpoints
  filename: step_{step:06d}
  monitor: val/collision_rate
  mode: min
  save_top_k: 1
  save_last: true
  save_on_train_epoch_end: false
wandb_checkpoint_writer:
  _target_: src.common.writers.wandb_checkpoint_writer.WandbCheckpointWriter
  artifact_name: ${task_name}-checkpoint
  task_name: ${task_name}
  selection: best
  missing_checkpoint: skip
wandb_artifact_lineage:
  _target_: src.common.callbacks.wandb_artifact_lineage.WandbArtifactLineageCallback
  fail_on_missing_run: false

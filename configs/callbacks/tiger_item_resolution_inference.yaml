# @package _global_
recommendation_artifact_writer:
  _target_: src.common.writers.WandbArtifactWriter
  output_dir: ${paths.output_dir}/recommendation_artifact
  flush_frequency: 1024
  artifact_name: ${task_name}-recommendation-output
  artifact_type: recommendation_output
  role: recommendation_output
  task_name: ${task_name}
  aliases: [latest]

resolution_trace_writer:
  _target_: src.common.writers.AuxiliaryTensorWriter
  output_dir: ${paths.output_dir}/item_resolution_trace
  payload_name: item_resolution_trace
  output_filename: item_resolution_trace.pt
  flush_frequency: 1024
  publish_wandb: true
  artifact_name: ${task_name}-item-resolution-trace
  artifact_type: item_resolution_trace
  role: item_resolution_trace
  aliases: [latest]
  validator:
    _target_: src.data.components.item_resolution.validate_resolution_trace
    _partial_: true
  metadata:
    task_name: ${task_name}

wandb_artifact_lineage:
  _target_: src.common.callbacks.wandb_artifact_lineage.WandbArtifactLineageCallback
  fail_on_missing_run: false
  clear_after_recording: true

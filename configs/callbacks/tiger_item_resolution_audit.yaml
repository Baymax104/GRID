# @package _global_
audit_writer:
  _target_: src.common.writers.auxiliary_tensor_writer.AuxiliaryTensorWriter
  output_dir: ${paths.output_dir}/audit_evidence
  payload_name: item_resolution_audit
  output_filename: item_resolution_audit.pt
  flush_frequency: 128
  publish_wandb: true
  artifact_name: ${task_name}-evidence
  artifact_type: item_resolution_audit
  role: item_resolution_audit
  validator:
    _target_: src.data.components.item_resolution_audit.validate_score_search_audit
    _partial_: true
wandb_artifact_lineage:
  _target_: src.common.callbacks.wandb_artifact_lineage.WandbArtifactLineageCallback
  fail_on_missing_run: false
  clear_after_recording: true

# @package _global_

defaults:
- /data@data: tiger_train
- /model@model: tiger_train
- /callbacks@callbacks: tiger_train
- /logger@logger: tiger_train
- /trainer@trainer: tiger_train
data_dir: ???
semantic_id_path: ???
num_hierarchies: ???
devices: ???
sequence_length: 200
run_mode: train
task_name: tiger_train
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
run_test_after_training: true
ckpt_path: null
seed: 42
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: true

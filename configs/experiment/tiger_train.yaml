# @package _global_

data_dir: ???
semantic_id_path: ???
num_hierarchies: ???
devices: ???

sequence_length: 200

run_mode: train
task_name: tiger_train
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}

run_test_after_training: true
ckpt_path: null
seed: 42

components:
  data_loading:
    data_iterator:
      _target_: src.data.loading.components.iterators.TFRecordIterator
    dataset_class:
      _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
      _partial_: true
    train_label:
      sequence_data:
        transform:
          _target_: src.data.loading.components.label_function.NextKTokenMasking
          next_k: ${model.num_hierarchies}
    eval_label:
      sequence_data:
        transform:
          _target_: src.data.loading.components.label_function.NextKTokenMasking
          next_k: ${model.num_hierarchies}
    preprocessing:
      filter_features: {_target_: src.data.loading.components.pre_processing.filter_features_to_consider, _partial_: true}
      dense_array: {_target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array, _partial_: true}
      convert_fields: {_target_: src.data.loading.components.pre_processing.convert_fields_to_tensors, _partial_: true}
      sparse_to_semantic_id:
        _target_: src.data.loading.components.pre_processing.map_sparse_id_to_semantic_id
        _partial_: true
        features_to_apply: [sequence_data]
        num_hierarchies: ${model.num_hierarchies}
    train_collate:
      _target_: src.data.loading.components.collate_functions.collate_with_sid_causal_duplicate
      _partial_: true
      sequence_length: ${data_loading.train_dataloader.sequence_length}
      padding_token: ${data_loading.train_dataloader.padding_token}
      sequence_field_name: sequence_data
      sid_hierarchy: ${model.num_hierarchies}
      max_batch_size: 32
    eval_collate:
      _target_: src.data.loading.components.collate_functions.collate_fn_train
      _partial_: true
      sequence_length: ${data_loading.val_dataloader.sequence_length}
      padding_token: ${data_loading.val_dataloader.padding_token}
    train_dataset:
      _target_: src.data.loading.components.interfaces.SemanticIDDatasetConfig
      user_id_field: ${data_loading.dataset.user_id_field}
      min_sequence_length: ${data_loading.dataset.min_sequence_length}
      keep_user_id: ${data_loading.dataset.keep_user_id}
      features_to_consider: ${data_loading.dataset.features_to_consider}
      num_placeholder_tokens_map: ${data_loading.dataset.num_placeholder_tokens_map}
      semantic_id_map:
        sequence_data:
          _target_: torch.load
          _args_:
            - _target_: src.utils.file_utils.open_local_or_remote
              file_path: ${semantic_id_path}
              mode: rb
      data_iterator: ${components.data_loading.data_iterator}
      preprocessing_functions:
        - ${components.data_loading.preprocessing.filter_features}
        - ${components.data_loading.preprocessing.dense_array}
        - ${components.data_loading.preprocessing.convert_fields}
        - ${components.data_loading.preprocessing.sparse_to_semantic_id}
    train_dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class: ${components.data_loading.dataset_class}
      data_folder: ${data_loading.train_dataloader.data_folder}
      should_shuffle_rows: ${data_loading.train_dataloader.should_shuffle_rows}
      labels: ${components.data_loading.train_label}
      batch_size_per_device: ${data_loading.train_dataloader.batch_size_per_device}
      num_workers: ${data_loading.train_dataloader.num_workers}
      timeout: ${data_loading.train_dataloader.timeout}
      assign_files_by_size: ${data_loading.train_dataloader.assign_files_by_size}
      oov_token: ${data_loading.train_dataloader.oov_token}
      masking_token: ${data_loading.train_dataloader.masking_token}
      sequence_length: ${data_loading.train_dataloader.sequence_length}
      padding_token: ${data_loading.train_dataloader.padding_token}
      drop_last: ${data_loading.train_dataloader.drop_last}
      persistent_workers: ${data_loading.train_dataloader.persistent_workers}
      collate_fn: ${components.data_loading.train_collate}
      dataset_config: ${components.data_loading.train_dataset}
      pin_memory: ${data_loading.train_dataloader.pin_memory}
    val_dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class: ${components.data_loading.dataset_class}
      data_folder: ${data_loading.val_dataloader.data_folder}
      should_shuffle_rows: ${data_loading.val_dataloader.should_shuffle_rows}
      labels: ${components.data_loading.eval_label}
      batch_size_per_device: ${data_loading.val_dataloader.batch_size_per_device}
      num_workers: ${data_loading.val_dataloader.num_workers}
      timeout: ${data_loading.val_dataloader.timeout}
      assign_files_by_size: ${data_loading.val_dataloader.assign_files_by_size}
      oov_token: ${data_loading.val_dataloader.oov_token}
      masking_token: ${data_loading.val_dataloader.masking_token}
      sequence_length: ${data_loading.val_dataloader.sequence_length}
      padding_token: ${data_loading.val_dataloader.padding_token}
      drop_last: ${data_loading.val_dataloader.drop_last}
      persistent_workers: ${data_loading.val_dataloader.persistent_workers}
      collate_fn: ${components.data_loading.eval_collate}
      dataset_config: ${components.data_loading.train_dataset}
      pin_memory: ${data_loading.val_dataloader.pin_memory}
    test_dataloader:
      _target_: src.data.loading.components.interfaces.SequenceDataloaderConfig
      dataset_class: ${components.data_loading.dataset_class}
      data_folder: ${data_loading.test_dataloader.data_folder}
      should_shuffle_rows: ${data_loading.test_dataloader.should_shuffle_rows}
      labels: ${components.data_loading.eval_label}
      batch_size_per_device: ${data_loading.test_dataloader.batch_size_per_device}
      num_workers: ${data_loading.test_dataloader.num_workers}
      timeout: ${data_loading.test_dataloader.timeout}
      assign_files_by_size: ${data_loading.test_dataloader.assign_files_by_size}
      oov_token: ${data_loading.test_dataloader.oov_token}
      masking_token: ${data_loading.test_dataloader.masking_token}
      sequence_length: ${data_loading.test_dataloader.sequence_length}
      padding_token: ${data_loading.test_dataloader.padding_token}
      drop_last: ${data_loading.test_dataloader.drop_last}
      persistent_workers: ${data_loading.test_dataloader.persistent_workers}
      collate_fn: ${components.data_loading.eval_collate}
      dataset_config: ${components.data_loading.train_dataset}
      pin_memory: ${data_loading.test_dataloader.pin_memory}
    datamodule:
      _target_: src.data.loading.datamodules.sequence.SequenceDataModule
      train_dataloader_config: ${components.data_loading.train_dataloader}
      val_dataloader_config: ${components.data_loading.val_dataloader}
      test_dataloader_config: ${components.data_loading.test_dataloader}
  model:
    root:
      _target_: src.recommendation.tiger_generation_model.SemanticIDEncoderDecoder
      huggingface_model: ${components.model.huggingface_model}
      postprocessor: ${model.postprocessor}
      aggregator: ${model.aggregator}
      optimizer: ${components.model.optimizer}
      scheduler: ${components.model.scheduler}
      loss_function: ${components.model.loss_function}
      evaluator: ${components.model.evaluator}
      feature_to_model_input_map: ${model.feature_to_model_input_map}
      decoder: ${components.model.decoder}
      codebooks: ${components.data_loading.train_dataset.semantic_id_map.sequence_data}
      num_hierarchies: ${model.num_hierarchies}
      should_check_prefix: ${model.should_check_prefix}
      num_user_bins: ${model.num_user_bins}
      mlp_layers: ${model.mlp_layers}
    huggingface_model:
      _target_: transformers.T5EncoderModel
      config:
        _target_: transformers.T5Config
        vocab_size: 256
        d_model: 128
        num_heads: 6
        dropout_rate: 0.1
        d_ff: 1024
        d_kv: 64
        num_layers: 4
    decoder:
      _target_: transformers.models.t5.modeling_t5.T5Stack
      config:
        _target_: transformers.models.t5.configuration_t5.T5Config
        vocab_size: ${components.model.huggingface_model.config.vocab_size}
        d_model: ${components.model.huggingface_model.config.d_model}
        num_heads: ${components.model.huggingface_model.config.num_heads}
        dropout_rate: 0.1
        d_ff: ${components.model.huggingface_model.config.d_ff}
        d_kv: ${components.model.huggingface_model.config.d_kv}
        num_layers: 4
        is_decoder: true
        is_encoder_decoder: false
    loss_function:
      _target_: torch.nn.CrossEntropyLoss
      ignore_index: -1
    optimizer:
      _target_: torch.optim.AdamW
      _partial_: true
      lr: 3.0e-4
      weight_decay: 0.001
    scheduler:
      _target_: src.common.components.scheduler.WarmupCosineSchedulerNonzeroMin
      _partial_: true
      warmup_steps: 1000
      min_ratio: 0.05
      scheduler_steps: ${trainer.max_steps}
    evaluator:
      _target_: src.common.components.eval_metrics.SIDRetrievalEvaluator
      top_k_list: [5, 10]
      metrics:
        ndcg: {_target_: src.common.components.eval_metrics.NDCG, _partial_: true}
        recall: {_target_: src.common.components.eval_metrics.Recall, _partial_: true}
  callbacks:
    model_checkpoint:
      _target_: lightning.pytorch.callbacks.ModelCheckpoint
      dirpath: ${paths.output_dir}/checkpoints
      filename: checkpoint_{epoch:03d}_{step:06d}
      monitor: ${callbacks.model_checkpoint.monitor}
      verbose: ${callbacks.model_checkpoint.verbose}
      save_last: ${callbacks.model_checkpoint.save_last}
      save_top_k: ${callbacks.model_checkpoint.save_top_k}
      mode: ${callbacks.model_checkpoint.mode}
      auto_insert_metric_name: ${callbacks.model_checkpoint.auto_insert_metric_name}
      save_weights_only: ${callbacks.model_checkpoint.save_weights_only}
      every_n_train_steps: ${callbacks.model_checkpoint.every_n_train_steps}
      train_time_interval: ${callbacks.model_checkpoint.train_time_interval}
      every_n_epochs: ${callbacks.model_checkpoint.every_n_epochs}
      save_on_train_epoch_end: ${callbacks.model_checkpoint.save_on_train_epoch_end}
    early_stopping:
      _target_: lightning.pytorch.callbacks.EarlyStopping
      monitor: ${callbacks.early_stopping.monitor}
      min_delta: ${callbacks.early_stopping.min_delta}
      patience: ${callbacks.early_stopping.patience}
      verbose: ${callbacks.early_stopping.verbose}
      mode: ${callbacks.early_stopping.mode}
      strict: ${callbacks.early_stopping.strict}
      check_finite: ${callbacks.early_stopping.check_finite}
      stopping_threshold: ${callbacks.early_stopping.stopping_threshold}
      divergence_threshold: ${callbacks.early_stopping.divergence_threshold}
      check_on_train_epoch_end: ${callbacks.early_stopping.check_on_train_epoch_end}
    model_summary: null
  logger:
    csv:
      _target_: lightning.pytorch.loggers.csv_logs.CSVLogger
      save_dir: ${paths.output_dir}
      name: ${logger.csv.name}
      prefix: ${logger.csv.prefix}
    wandb:
      _target_: lightning.pytorch.loggers.wandb.WandbLogger
      name: ${logger.wandb.name}
      save_dir: ${paths.output_dir}
      project: ${logger.wandb.project}
      group: ${logger.wandb.group}
  trainer:
    root:
      _target_: lightning.pytorch.trainer.Trainer
      default_root_dir: ${paths.output_dir}
      min_steps: ${trainer.min_steps}
      max_steps: ${trainer.max_steps}
      min_epochs: ${trainer.min_epochs}
      max_epochs: ${trainer.max_epochs}
      accelerator: ${trainer.accelerator}
      devices: ${trainer.devices}
      num_nodes: ${trainer.num_nodes}
      precision: ${trainer.precision}
      log_every_n_steps: ${trainer.log_every_n_steps}
      val_check_interval: ${trainer.val_check_interval}
      deterministic: ${trainer.deterministic}
      accumulate_grad_batches: ${trainer.accumulate_grad_batches}
      profiler: ${trainer.profiler}
      strategy: ${trainer.strategy}
      sync_batchnorm: ${trainer.sync_batchnorm}
      num_sanity_val_steps: ${trainer.num_sanity_val_steps}

data_loading:
  features:
    - name: sequence_data
      num_placeholder_tokens: 0
      semantic_ids: ${semantic_id_path}
      is_item_ids: true
      type: {_target_: torch.__dict__.get, _args_: [int32]}
    - name: embedding
      type: {_target_: torch.__dict__.get, _args_: [float32]}
    - name: text
      type: {_target_: torch.__dict__.get, _args_: [bytes]}
    - name: user_id
      is_item_ids: true
      type: {_target_: torch.__dict__.get, _args_: [int32]}
  dataset:
    user_id_field: user_id
    min_sequence_length: 1
    keep_user_id: true
    features_to_consider: ${extract_fields_from_list_of_dicts:${data_loading.features}, "name", False, "is_item_ids", "True"}
    num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data_loading.features}, "name", "num_placeholder_tokens"}
  train_dataloader:
    data_folder: ${paths.data_dir}/training
    should_shuffle_rows: true
    batch_size_per_device: 32
    num_workers: 16
    timeout: 60
    assign_files_by_size: false
    oov_token: null
    masking_token: 0
    sequence_length: ${sequence_length}
    padding_token: -1
    drop_last: true
    persistent_workers: true
    pin_memory: true
  val_dataloader:
    data_folder: ${paths.data_dir}/evaluation
    should_shuffle_rows: false
    batch_size_per_device: 8
    num_workers: 8
    timeout: 60
    assign_files_by_size: true
    oov_token: ${data_loading.train_dataloader.oov_token}
    masking_token: ${data_loading.train_dataloader.masking_token}
    sequence_length: ${data_loading.train_dataloader.sequence_length}
    padding_token: ${data_loading.train_dataloader.padding_token}
    drop_last: false
    persistent_workers: false
    pin_memory: false
  test_dataloader:
    data_folder: ${paths.data_dir}/testing
    should_shuffle_rows: false
    batch_size_per_device: 8
    num_workers: 8
    timeout: 60
    assign_files_by_size: true
    oov_token: ${data_loading.train_dataloader.oov_token}
    masking_token: ${data_loading.train_dataloader.masking_token}
    sequence_length: ${data_loading.train_dataloader.sequence_length}
    padding_token: ${data_loading.train_dataloader.padding_token}
    drop_last: false
    persistent_workers: false
    pin_memory: false
  

model:
  postprocessor: null
  aggregator: null
  feature_to_model_input_map:
    sequence_data: input_ids
    user_id: user_id
  num_hierarchies: ${num_hierarchies}
  should_check_prefix: true
  num_user_bins: null
  mlp_layers: 2

callbacks:
  model_checkpoint:
    monitor: val/recall@5
    verbose: true
    save_last: null
    save_top_k: 1
    mode: max
    auto_insert_metric_name: true
    save_weights_only: false
    every_n_train_steps: null
    train_time_interval: null
    every_n_epochs: null
    save_on_train_epoch_end: false
  early_stopping:
    monitor: ${callbacks.model_checkpoint.monitor}
    min_delta: 0.0
    patience: 10
    verbose: true
    mode: ${callbacks.model_checkpoint.mode}
    strict: true
    check_finite: true
    stopping_threshold: null
    divergence_threshold: null
    check_on_train_epoch_end: false
  model_summary: null

logger:
  csv:
    name: csv/
    prefix: ''
  wandb:
    name: ${now_tz:%Y-%m-%d_%H-%M-%S}
    project: GRID
    group: tiger

trainer:
  min_steps: 1
  max_steps: 20000
  min_epochs: 0
  max_epochs: 10
  accelerator: gpu
  devices: ${devices}
  num_nodes: 1
  precision: 32-true
  log_every_n_steps: 100
  val_check_interval: 500
  deterministic: false
  accumulate_grad_batches: 1
  profiler: {_target_: lightning.pytorch.profilers.PassThroughProfiler}
  strategy: ddp
  sync_batchnorm: false
  num_sanity_val_steps: 0

paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: true

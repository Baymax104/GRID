# @package _global_

defaults:
- /data@data: rvq_inference
- /model@model: rvq_inference
- /callbacks@callbacks: rvq_inference
- /logger@logger: rvq_inference
- /trainer@trainer: rvq_inference

data_dir: ???
embedding_path: ???
codebook_size: 256
num_hierarchies: 3
embedding_dim: 768
ckpt_path: ???
devices: ???

run_mode: inference
task_name: rvq_inference
project: GRID
user: baymaxam
group: rvq
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
seed: 42
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false

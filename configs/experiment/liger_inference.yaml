# @package _global_
defaults:
- /data@data: liger_inference
- /model@model: liger
- /callbacks@callbacks: liger_inference
- /logger@logger: tiger_inference
- /trainer@trainer: tiger_inference

data_dir: ???
semantic_id_path: ???
embedding_path: ???

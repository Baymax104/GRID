# @package _global_
defaults:
- /data@data: tiger_train
- /model@model: tiger_training_probe
- /callbacks@callbacks: tiger_training_probe
- /logger@logger: tiger_train
- /trainer@trainer: tiger_train

data_dir: ???
semantic_id_path: ???
initialization_checkpoint_path: ???
probe_arm: ???
devices: ???
group: ???
num_hierarchies: 4
codebook_size: 256
sequence_length: 180
run_mode: train
task_name: tiger_training_probe
project: GRID
user: baymaxam
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
seed: 42
ckpt_path: null
run_test_after_training: false
training_probe:
  layers: [2, 3]
  alpha: 0.25
  cap: 2.0
trainer:
  root:
    max_steps: 2000
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false

# @package _global_

# -----------------------------
# Manual inputs
# -----------------------------
data_dir: ???

# -----------------------------
# Static experiment inputs
# -----------------------------
embedding_model: ${paths.pretrained_models_dir}/flan-t5-base

# -----------------------------
# Runtime metadata
# -----------------------------
run_mode: inference
task_name: sem_embeds_inference
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}

# -----------------------------
# Runtime switches
# -----------------------------
ckpt_path: null
seed: 42

# -----------------------------
# Components
# -----------------------------
components:
  data_loading:
    data_iterator:
      _target_: src.data.loading.components.iterators.TFRecordIterator
    dataset_class:
      _target_: src.data.loading.components.dataloading.UnboundedSequenceIterable
      _partial_: true
    collate:
      _target_: src.data.loading.components.collate_functions.collate_fn_items
      _partial_: true
      item_id_field: ${data_loading.dataset.item_id_field}
      feature_to_input_name: ${data_loading.predict_dataloader.feature_to_input_name}
    preprocessing:
      filter_features:
        _target_: src.data.loading.components.pre_processing.filter_features_to_consider
        _partial_: true
      dense_array:
        _target_: src.data.loading.components.pre_processing.convert_to_dense_numpy_array
        _partial_: true
        features_to_apply: [id, text]
      squeeze_text:
        _target_: src.data.loading.components.pre_processing.squeeze_tensor_in_place
        _partial_: true
        features_to_apply: [text]
      convert_id:
        _target_: src.data.loading.components.pre_processing.convert_fields_to_tensors
        _partial_: true
        features_to_apply: [id]
      bytes_to_string:
        _target_: src.data.loading.components.pre_processing.convert_bytes_to_string
        _partial_: true
        features_to_apply: [text]
      tokenize_text:
        _target_: src.data.loading.components.pre_processing.tokenize_text_features
        _partial_: true
        features_to_apply: [text]
        tokenizer_config: ${data_loading.tokenizer}
      squeeze_tokenized:
        _target_: src.data.loading.components.pre_processing.squeeze_tensor_in_place
        _partial_: true
        features_to_apply: [text, text_mask]
    dataset:
      _target_: src.data.loading.components.interfaces.ItemDatasetConfig
      item_id_field: ${data_loading.dataset.item_id_field}
      keep_item_id: ${data_loading.dataset.keep_item_id}
      data_iterator: ${components.data_loading.data_iterator}
      features_to_consider: ${data_loading.dataset.features_to_consider}
      num_placeholder_tokens_map: ${data_loading.dataset.num_placeholder_tokens_map}
      preprocessing_functions:
        - ${components.data_loading.preprocessing.filter_features}
        - ${components.data_loading.preprocessing.dense_array}
        - ${components.data_loading.preprocessing.squeeze_text}
        - ${components.data_loading.preprocessing.convert_id}
        - ${components.data_loading.preprocessing.bytes_to_string}
        - ${components.data_loading.preprocessing.tokenize_text}
        - ${components.data_loading.preprocessing.squeeze_tokenized}
      field_type_map: ${data_loading.dataset.field_type_map}
    predict_dataloader:
      _target_: src.data.loading.components.interfaces.ItemDataloaderConfig
      dataset_class: ${components.data_loading.dataset_class}
      data_folder: ${data_loading.predict_dataloader.data_folder}
      should_shuffle_rows: ${data_loading.predict_dataloader.should_shuffle_rows}
      batch_size_per_device: ${data_loading.predict_dataloader.batch_size_per_device}
      num_workers: ${data_loading.predict_dataloader.num_workers}
      assign_files_by_size: ${data_loading.predict_dataloader.assign_files_by_size}
      timeout: ${data_loading.predict_dataloader.timeout}
      drop_last: ${data_loading.predict_dataloader.drop_last}
      pin_memory: ${data_loading.predict_dataloader.pin_memory}
      persistent_workers: ${data_loading.predict_dataloader.persistent_workers}
      collate_fn: ${components.data_loading.collate}
      dataset_config: ${components.data_loading.dataset}
      limit_files: ${data_loading.predict_dataloader.limit_files}
    datamodule:
      _target_: src.data.loading.datamodules.item.ItemDataModule
      predict_dataloader_config: ${components.data_loading.predict_dataloader}
  model:
    semantic_embedding_model:
      _target_: src.embedding.hf_language_model.HFLanguageModel
      huggingface_model:
        _target_: transformers.T5EncoderModel.from_pretrained
        pretrained_model_name_or_path: ${embedding_model}
      aggregator:
        _target_: src.common.modules.embedding_aggregator.EmbeddingAggregator
        aggregation_strategy:
          _target_: src.common.components.aggregation_strategy.MeanAggregation
    root:
      _target_: src.embedding.semantic_embedding_inference_module.SemanticEmbeddingInferenceModule
      semantic_embedding_model_input_map: ${model.semantic_embedding_model_input_map}
      semantic_embedding_model: ${components.model.semantic_embedding_model}
  callbacks:
    pickle_writer:
      _target_: src.utils.inference_utils.LocalPickleWriter
      output_dir: ${paths.output_dir}/pickle
      flush_frequency: 64
      write_interval: batch
      should_merge_files_on_main: true
      prediction_key_name: item_id
      prediction_name: embedding
      should_merge_list_of_keyed_tensors_to_single_tensor: true
  logger:
    {}
  trainer:
    root:
      _target_: lightning.pytorch.trainer.Trainer
      default_root_dir: ${paths.output_dir}
      min_steps: ${trainer.min_steps}
      max_steps: ${trainer.max_steps}
      max_epochs: ${trainer.max_epochs}
      accelerator: ${trainer.accelerator}
      devices: ${trainer.devices}
      num_nodes: ${trainer.num_nodes}
      precision: ${trainer.precision}
      log_every_n_steps: ${trainer.log_every_n_steps}
      val_check_interval: ${trainer.val_check_interval}
      deterministic: ${trainer.deterministic}
      accumulate_grad_batches: ${trainer.accumulate_grad_batches}
      profiler: ${trainer.profiler}

# -----------------------------
# Data loading parameters
# -----------------------------
data_loading:
  tokenizer:
    max_length: 128
    padding: max_length
    truncation: true
    add_special_tokens: true
    postprocess_eos_token: false
    tokenizer:
      _target_: transformers.AutoTokenizer.from_pretrained
      pretrained_model_name_or_path: ${embedding_model}
  features:
    - name: id
      num_placeholder_tokens: 0
      is_item_ids: true
      type:
        _target_: torch.__dict__.get
        _args_: [int32]
    - name: text
      type:
        _target_: torch.__dict__.get
        _args_: [bytes]
      is_text: true
    - name: embedding
      type:
        _target_: torch.__dict__.get
        _args_: [float32]
      is_embedding: true
  dataset:
    item_id_field: id
    keep_item_id: true
    features_to_consider: ${extract_fields_from_list_of_dicts:${data_loading.features}, "name", False, "is_text", "True"}
    num_placeholder_tokens_map: ${create_map_from_list_of_dicts:${data_loading.features}, "name", "num_placeholder_tokens"}
    field_type_map: ${create_map_from_list_of_dicts:${data_loading.features}, "name", "type"}
  predict_dataloader:
    data_folder: ${paths.data_dir}/items
    should_shuffle_rows: false
    batch_size_per_device: 8
    num_workers: 2
    assign_files_by_size: true
    timeout: 60
    drop_last: false
    pin_memory: false
    persistent_workers: true
    limit_files: null
    feature_to_input_name:
      id: item_ids
      text: text_tokens
      text_mask: text_mask
      embedding: input_embedding

model:
  semantic_embedding_model_input_map:
    input_ids: text_tokens
    attention_mask: text_mask
 
trainer:
  min_steps: 1
  max_steps: 80000
  max_epochs: 10
  accelerator: gpu
  devices: [0, 1]
  num_nodes: 1
  precision: 32
  log_every_n_steps: 2500
  val_check_interval: 5000
  deterministic: false
  accumulate_grad_batches: 1
  profiler:
    _target_: lightning.pytorch.profilers.PassThroughProfiler

# -----------------------------
# Paths and extras
# -----------------------------
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: true

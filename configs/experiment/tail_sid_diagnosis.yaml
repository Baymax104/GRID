# @package _global_

defaults:
- /data@data: tail_sid_diagnosis
- /model@model: tail_sid_diagnosis
- /callbacks@callbacks: tail_sid_diagnosis
- /logger@logger: tail_sid_diagnosis
- /trainer@trainer: tail_sid_diagnosis

data_dir: ???
semantic_id_path: ???
embedding_path: null
recommendation_output_path: null
widened_recommendation_output_path: null
fixed_prefix_trace_path: null
widened_prefix_trace_path: null
baseline_recommendation_output_path: null
intervention_recommendation_output_path: null
baseline_prefix_trace_path: null
intervention_prefix_trace_path: null
calibration_statistics_ready: false
search_ranking:
  enabled: false
risk_standardization:
  enabled: false
  bin_count: 5
  bin_count_sensitivity: [3, 5, 10]
  min_items_per_group_per_bin: 20
  min_item_retention: 0.5
  max_abs_raw_damage_smd: 0.1
  min_bootstrap_valid_fraction: 0.9
candidate_allocation_probe:
  enabled: false
  overall_hit10_loss_guardrail: 0.002
  head_hit10_loss_guardrail: 0.005
raw_num_hierarchies: ???
head_ratio: 0.2
tail_ratio: 0.2
max_neighbors_per_bucket: 512
priority_multipliers:
  Head: 1.0
  Mid: 1.1
  Tail: 1.25
  Tail-Cold: 1.35
semantic_reference_quantile: 0.75
semantic_bucket_quantile: 0.25
semantic_reference_pairs: 100000
semantic_seed: ${seed}
bootstrap_samples: 1000
bootstrap_confidence: 0.95
frequency_bin_count: 5
min_frequency_bin_support: 20
hit_ks: [5, 10]
max_harmful_pairs: 100000
max_harmful_pairs_per_item: 20
tail_ratio_sensitivity: [0.1, 0.2, 0.3]
semantic_quantile_sensitivity: [0.5, 0.75, 0.9]
damage_component_sensitivity: [all, structural_only, semantic_only]
diagnosis_evidence_output_dir: ${paths.output_dir}/diagnosis_evidence

run_mode: analysis
task_name: tail_sid_diagnosis
project: GRID
user: baymaxam
group: ???
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
seed: 42
ckpt_path: null

paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false

# @package _global_

defaults:
- /data@data: rkmeans_train
- /model@model: rkmeans_train
- /callbacks@callbacks: rkmeans_train
- /logger@logger: rkmeans_train
- /trainer@trainer: rkmeans_train
data_dir: ???
embedding_path: ???
embedding_dim: 768
num_hierarchies: 3
codebook_size: 256
devices: ???
run_mode: train
task_name: rkmeans_train
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
run_test_after_training: false
ckpt_path: null
seed: 42
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false

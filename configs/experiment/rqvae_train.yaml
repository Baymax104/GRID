# @package _global_

defaults:
- /data_loading@data_loading: rqvae_train
- /model@model: rqvae_train
- /callbacks@callbacks: rqvae_train
- /logger@logger: rqvae_train
- /trainer@trainer: rqvae_train
data_dir: ???
embedding_path: ???
embedding_dim: ???
num_hierarchies: ???
codebook_width: ???
run_mode: train
task_name: rqvae_train
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
run_test_after_training: false
ckpt_path: null
seed: 42
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: true
optim:
  optimizer:
    _target_: torch.optim.Adagrad
    _partial_: true
    lr: 0.001
    weight_decay: 0.0
  scheduler:
    _target_: src.common.components.scheduler.WarmupLinearScheduler
    _partial_: true
    warmup_steps: 1000
    min_ratio: 0.01
    scheduler_steps: ${trainer.root.max_steps}
eval:
  evaluator:
    placeholder_token_buffer: 0

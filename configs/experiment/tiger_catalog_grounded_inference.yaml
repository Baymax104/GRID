# @package _global_
defaults:
- /data@data: tiger_prefix_trace
- /model@model: tiger_catalog_grounded_inference
- /callbacks@callbacks: tiger_catalog_grounded_inference
- /logger@logger: tiger_prefix_trace
- /trainer@trainer: tiger_inference

data_dir: ???
data_split: ???
semantic_id_path: ???
embedding_path: ???
ckpt_path: ???
checkpoint_reference: null
catalog_arm: ???
dataset_name: ???
devices: ???
group: ???
prefix_trace: true
num_hierarchies: 4
codebook_size: 256
beam_width: 10
sequence_length: 180
run_mode: inference
task_name: tiger_catalog_grounded_${catalog_arm}_${dataset_name}_${data_split}_beam${beam_width}
project: GRID
user: baymaxam
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
seed: 42
paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata
extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false

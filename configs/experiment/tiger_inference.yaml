# @package _global_

defaults:
- /data@data: tiger_inference
- /model@model: tiger_inference
- /callbacks@callbacks: tiger_inference
- /logger@logger: tiger_inference
- /trainer@trainer: tiger_inference

data_dir: ???
semantic_id_path: ???
ckpt_path: ???
num_hierarchies: 4
codebook_size: 256

run_mode: inference
task_name: tiger_inference
project: GRID
user: baymaxam
group: tiger
id: ${now_tz:%Y-%m-%d}/${now_tz:%H-%M-%S}
seed: 42
sequence_length: 180

paths:
  root_dir: .
  data_dir: ${data_dir}
  log_dir: ${paths.root_dir}/logs
  output_dir: ${hydra:runtime.output_dir}
  work_dir: ${hydra:runtime.cwd}
  profile_dir: ${hydra:run.dir}/profile_output
  metadata_dir: ${paths.output_dir}/metadata

extras:
  ignore_warnings: false
  print_config_warnings: true
  print_config: false

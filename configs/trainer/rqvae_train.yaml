# @package _global_

root:
  _target_: lightning.pytorch.trainer.Trainer
  default_root_dir: ${paths.output_dir}
  max_steps: 3000
  accelerator: gpu
  devices: ${devices}
  precision: bf16-mixed
  log_every_n_steps: 50
  limit_val_batches: 0
  strategy: ddp_find_unused_parameters_true
  sync_batchnorm: true

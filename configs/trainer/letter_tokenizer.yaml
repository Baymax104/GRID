# @package _global_
root:
  _target_: lightning.pytorch.Trainer
  default_root_dir: ${paths.output_dir}
  max_epochs: 20000
  accelerator: gpu
  devices: ${devices}
  precision: 32-true
  strategy: auto
  accumulate_grad_batches: 1
  log_every_n_steps: 50
  check_val_every_n_epoch: 2000
  num_sanity_val_steps: 0

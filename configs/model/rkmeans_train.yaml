# @package _global_

root:
  _target_: src.quantization.rkmeans.residual_kmeans.ResidualKMeans
  n_layers: ${num_hierarchies}
  n_clusters: ${codebook_size}
  n_features: ${embedding_dim}
  training_model_config: ${model.training_model_config}
  sub_layer:
    _target_: src.quantization.rkmeans.kmeans_layer.KMeansLayer
    _partial_: true
    n_clusters: ${codebook_size}
    n_features: ${embedding_dim}
    init_buffer_size: 3072

training_model_config:
  _target_: src.common.configs.model.TrainingModelConfig
  loss_function:
    _target_: src.common.components.loss_functions.WeightedSquaredError
  optimizer:
    _target_: torch.optim.SGD
    _partial_: true
    lr: 0.5
  scheduler:
    _target_: src.common.components.scheduler.WarmupCosineSchedulerNonzeroMin
    _partial_: true
    warmup_steps: 100
    min_ratio: 0.3
    scheduler_steps: ${trainer.root.max_steps}

metrics:
  _target_: src.common.metrics.MetricEngine
  stages:
    train:
      loss:
        metric:
          _target_: torchmetrics.MeanMetric
        input: loss
      quantization_loss:
        metric:
          _target_: torchmetrics.MeanMetric
        input: quantization_loss
      first_residuals_norm_ratio:
        metric:
          _target_: torchmetrics.MeanMetric
        input:
          key: first_residuals_norm_ratio
      last_residuals_norm_ratio:
        metric:
          _target_: torchmetrics.MeanMetric
        input:
          key: last_residuals_norm_ratio
      first_centroids_norm:
        metric:
          _target_: torchmetrics.MeanMetric
        input:
          key: first_centroids_norm
      last_centroids_norm:
        metric:
          _target_: torchmetrics.MeanMetric
        input:
          key: last_centroids_norm
      frac_unique_ids:
        metric:
          _target_: torchmetrics.MeanMetric
        input:
          key: frac_unique_ids
      mse:
        metric:
          _target_: torchmetrics.MeanMetric
        input:
          key: mse
      layer_coverages:
        repeat:
          count: ${num_hierarchies}
          index_name: layer_idx
          name_template: layer_{layer_idx}/frac_layer_coverages
          metric:
            _target_: torchmetrics.MeanMetric
          input:
            key: layer_coverages
            index: "{layer_idx}"
      layer_id_entropy:
        repeat:
          count: ${num_hierarchies}
          index_name: layer_idx
          name_template: layer_{layer_idx}/id_entropy
          metric:
            _target_: torchmetrics.MeanMetric
          input:
            key: layer_id_entropies
            index: "{layer_idx}"
    val:
      loss:
        metric:
          _target_: torchmetrics.MeanMetric
        input: loss
      first_residuals_norm_ratio:
        metric:
          _target_: torchmetrics.MeanMetric
        input: first_residuals_norm_ratio
      last_residuals_norm_ratio:
        metric:
          _target_: torchmetrics.MeanMetric
        input: last_residuals_norm_ratio
      frac_unique_ids:
        metric:
          _target_: torchmetrics.MeanMetric
        input: frac_unique_ids
      mse:
        metric:
          _target_: torchmetrics.MeanMetric
        input: mse
    test:
      loss:
        metric:
          _target_: torchmetrics.MeanMetric
        input: loss
      first_residuals_norm_ratio:
        metric:
          _target_: torchmetrics.MeanMetric
        input: first_residuals_norm_ratio
      last_residuals_norm_ratio:
        metric:
          _target_: torchmetrics.MeanMetric
        input: last_residuals_norm_ratio
      frac_unique_ids:
        metric:
          _target_: torchmetrics.MeanMetric
        input: frac_unique_ids
      mse:
        metric:
          _target_: torchmetrics.MeanMetric
        input: mse

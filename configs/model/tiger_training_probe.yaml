# @package _global_
defaults:
- tiger_train@_here_
- _self_

root:
  _target_: src.recommendation.tiger_training_probe.module.TigerTrainingProbe
  initialization_checkpoint_path: ${initialization_checkpoint_path}
  resume_checkpoint_path: ${ckpt_path}
  arm: ${probe_arm}
  layers: ${training_probe.layers}
  alpha: ${training_probe.alpha}
  cap: ${training_probe.cap}
  wandb_entity: ${user}
  wandb_project: ${project}
  statistics:
    _target_: src.data.components.tiger_training_statistics.load_training_statistics
    semantic_id_path: ${semantic_id_path}
    training_data_dir: ${data.train_dataloader.data_folder}
    num_hierarchies: ${num_hierarchies}
    max_num_sequences: ${data.train_preprocessing_functions.4.max_num_sequences}
    source_split: training
    wandb_entity: ${user}
    wandb_project: ${project}

training_model_config:
  optimizer:
    lr: 0.00005

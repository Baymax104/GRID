# @package _global_

root:
  _target_: src.quantization.tail_sid_diagnosis.module.TailSIDDiagnosisModule
  max_neighbors_per_bucket: ${max_neighbors_per_bucket}
  priority_multipliers: ${priority_multipliers}
  semantic_reference_quantile: ${semantic_reference_quantile}
  semantic_bucket_quantile: ${semantic_bucket_quantile}
  semantic_reference_pairs: ${semantic_reference_pairs}
  semantic_seed: ${semantic_seed}
  max_harmful_pairs: ${max_harmful_pairs}
  max_harmful_pairs_per_item: ${max_harmful_pairs_per_item}
  hit_ks: ${hit_ks}
  bootstrap_samples: ${bootstrap_samples}
  bootstrap_confidence: ${bootstrap_confidence}
  frequency_bin_count: ${frequency_bin_count}
  min_frequency_bin_support: ${min_frequency_bin_support}
  tail_ratio_sensitivity: ${tail_ratio_sensitivity}
  semantic_quantile_sensitivity: ${semantic_quantile_sensitivity}
  damage_component_sensitivity: ${damage_component_sensitivity}
  head_ratio: ${head_ratio}
  tail_ratio: ${tail_ratio}
  search_ranking_enabled: ${search_ranking.enabled}
  risk_standardization_enabled: ${risk_standardization.enabled}
  risk_standardization_bin_count: ${risk_standardization.bin_count}
  risk_standardization_bin_count_sensitivity: ${risk_standardization.bin_count_sensitivity}
  risk_standardization_min_items_per_group_per_bin: ${risk_standardization.min_items_per_group_per_bin}
  risk_standardization_min_item_retention: ${risk_standardization.min_item_retention}
  risk_standardization_max_abs_raw_damage_smd: ${risk_standardization.max_abs_raw_damage_smd}
  risk_standardization_min_bootstrap_valid_fraction: ${risk_standardization.min_bootstrap_valid_fraction}
  candidate_allocation_probe_enabled: ${candidate_allocation_probe.enabled}
  candidate_allocation_overall_hit10_loss_guardrail: ${candidate_allocation_probe.overall_hit10_loss_guardrail}
  candidate_allocation_head_hit10_loss_guardrail: ${candidate_allocation_probe.head_hit10_loss_guardrail}

metric_callback:
  logging_modes:
    test: summary

metrics:
  _target_: src.common.metrics.MetricEngine
  stages:
    test:
      structural:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: structural
        spec:
          kwargs:
            evidence:
              key: evidence
      semantic:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: semantic
        spec:
          kwargs:
            evidence:
              key: evidence
      damage:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: damage
        spec:
          kwargs:
            evidence:
              key: evidence
      prefix_risk:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: prefix_risk
        spec:
          kwargs:
            evidence:
              key: evidence
      prefix_mechanism:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: prefix_mechanism
        spec:
          kwargs:
            evidence:
              key: evidence
      search_ranking:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: search_ranking
        spec:
          kwargs:
            evidence:
              key: evidence
      candidate_allocation:
        metric:
          _target_: src.quantization.tail_sid_diagnosis.metrics.EvidenceSectionMetric
          section: candidate_allocation
        spec:
          kwargs:
            evidence:
              key: evidence

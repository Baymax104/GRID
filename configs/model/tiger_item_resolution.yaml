# @package _global_
defaults:
- tiger_train@_here_
- _self_

root:
  _target_: src.recommendation.tiger_item_resolution.TigerItemResolution
  arm: ${resolution_arm}
  top_k_for_generation: ${beam_width}
  catalog:
    _target_: src.data.components.catalog_content.load_catalog_content
    semantic_id_path: ${semantic_id_path}
    embedding_path: ${embedding_path}
    wandb_entity: ${user}
    wandb_project: ${project}
  projection_dim: 128
  max_bucket: 128
  temperature: 0.1
  route_weight: 0.1
  resolve_weight: 0.1
  warmup_steps: 2000
  max_states: ${search_states}
  max_item_scores: ${search_item_scores}
  expansion_batch_size: 8
  hybrid_weight: 0.5
  initialization_seed: 42

metrics:
  stages:
    train:
      item_nll:
        metric: {_target_: torchmetrics.MeanMetric}
        spec: {key: item_nll}
      route_loss:
        metric: {_target_: torchmetrics.MeanMetric}
        spec: {key: route_loss}
      resolve_loss:
        metric: {_target_: torchmetrics.MeanMetric}
        spec: {key: resolve_loss}
      gate_mean:
        metric: {_target_: torchmetrics.MeanMetric}
        spec: {key: gate_mean}

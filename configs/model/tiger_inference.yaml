# @package _global_

root:
  _target_: src.recommendation.tiger.Tiger
  encoder: ${model.encoder}
  decoder: ${model.decoder}
  num_hierarchies: ${num_hierarchies}
  codebook_size: ${codebook_size}
  embedding_dim: 128
  semantic_ids:
    _target_: src.data.utils.load_semantic_id_tensor
    file_path: ${semantic_id_path}
  top_k_for_generation: 10
  should_check_prefix: true

encoder:
  _target_: transformers.T5EncoderModel
  config:
    _target_: transformers.T5Config
    vocab_size: ${model.root.codebook_size}
    d_model: ${model.root.embedding_dim}
    num_heads: 6
    dropout_rate: 0.15
    d_ff: 1024
    d_kv: 64
    num_layers: 4

decoder:
  _target_: transformers.models.t5.modeling_t5.T5Stack
  config:
    _target_: transformers.models.t5.configuration_t5.T5Config
    vocab_size: ${model.encoder.config.vocab_size}
    d_model: ${model.root.embedding_dim}
    num_heads: ${model.encoder.config.num_heads}
    dropout_rate: ${model.encoder.config.dropout_rate}
    d_ff: ${model.encoder.config.d_ff}
    d_kv: ${model.encoder.config.d_kv}
    num_layers: ${model.encoder.config.num_layers}
    is_decoder: true
    is_encoder_decoder: false

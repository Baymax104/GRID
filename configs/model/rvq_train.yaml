# @package _global_

root:
  _target_: src.quantization.residual_vector_quantization.ResidualVectorQuantization
  n_layers: ${num_hierarchies}
  n_clusters: ${codebook_width}
  n_features: ${embedding_dim}
  distance_function: ${model.distance_function}
  initializer: ${model.initializer}
  quantization_strategy: ${model.quantization_strategy}
  loss_function: ${model.loss_function}
  init_buffer_size: 3072
  normalize_residuals: true
  track_residuals: true
  optimizer: ${model.optimizer}
  scheduler: null
  training_loop_function: ${model.training_loop_function}
distance_function:
  _target_: src.common.components.distance_functions.SquaredEuclideanDistance
initializer:
  _target_: src.common.components.clustering_initializers.KMeansPlusPlusInitInitializer
  n_clusters: ${codebook_width}
  initialize_on_cpu: false
  distance_function: ${model.distance_function}
quantization_strategy:
  _target_: src.common.components.quantization_strategies.STEQuantization
  distance_function: ${model.distance_function}
  compute_reconstruction_loss_embeddings: false
loss_function:
  _target_: src.common.components.loss_functions.BetaQuantizationLoss
  beta: 0.25
training_loop_function:
  _target_: src.quantization.training_loop_functions.scale_loss_by_world_size_for_initialization_training_loop
  _partial_: true
optimizer:
  _target_: torch.optim.Adagrad
  _partial_: true
  lr: 0.001
  weight_decay: 0.0

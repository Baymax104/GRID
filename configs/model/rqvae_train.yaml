# @package _global_

root:
  _target_: src.quantization.residual_quantization.ResidualQuantization
  track_residuals: true
  verbose: true
  train_layer_wise: false
  normalize_residuals: false
  input_dim: ${embedding_dim}
  n_layers: ${num_hierarchies}
  normalization_layer: ${model.normalization_layer}
  encoder: ${model.encoder}
  decoder: ${model.decoder}
  init_buffer_size: 3072
  quantization_layer: ${model.quantization_layer}
  reconstruction_loss_function: ${model.reconstruction_loss_function}
  reconstruction_loss_weight: 1.0
  training_loop_function: ${model.training_loop_function}
  optimizer: ${optim.optimizer}
  scheduler: null
  quantization_layer_list: null
normalization_layer:
  _target_: torch.nn.Sequential
  _args_:
  - _target_: torch.nn.BatchNorm1d
    num_features: ${model.root.input_dim}
  - _target_: src.common.modules.normalize_layer.NormalizeLayer
encoder:
  _target_: src.common.modules.mlp.MLP
  input_dim: ${model.root.input_dim}
  hidden_dim_list:
  - 768
  - 256
  - 128
  output_dim: 64
  activation:
    _target_: torch.nn.ReLU
    _partial_: true
decoder:
  _target_: src.common.modules.mlp.MLP
  input_dim: ${model.encoder.output_dim}
  hidden_dim_list:
  - 128
  - 256
  - 768
  output_dim: ${model.root.input_dim}
  activation:
    _target_: torch.nn.ReLU
    _partial_: true
quantization_layer:
  _target_: src.quantization.vector_quantization.VectorQuantization
  n_clusters: ${codebook_width}
  n_features: ${model.encoder.output_dim}
  distance_function:
    _target_: src.common.components.distance_functions.SquaredEuclideanDistance
  quantization_strategy:
    _target_: src.common.components.quantization_strategies.STEQuantization
    distance_function: ${model.quantization_layer.distance_function}
    compute_reconstruction_loss_embeddings: true
  initializer:
    _target_: src.common.components.clustering_initializers.ClusteringModuleInitializer
    n_clusters: ${codebook_width}
    initialize_on_cpu: false
    clustering_module:
      _target_: src.quantization.mini_batch_kmeans.MiniBatchKMeans
      n_clusters: ${codebook_width}
      n_features: ${model.quantization_layer.n_features}
      distance_function: ${model.quantization_layer.distance_function}
      initializer:
        _target_: src.common.components.clustering_initializers.KMeansPlusPlusInitInitializer
        n_clusters: ${codebook_width}
        distance_function: ${model.quantization_layer.distance_function}
        initialize_on_cpu: false
      init_buffer_size: ${model.root.init_buffer_size}
      update_manually: true
    max_iter: 1000
  init_buffer_size: ${model.root.init_buffer_size}
  loss_function:
    _target_: src.common.components.loss_functions.BetaQuantizationLoss
    beta: 0.25
    reduction: mean
  optimizer: null
reconstruction_loss_function:
  _target_: torch.nn.MSELoss
  reduction: mean
training_loop_function:
  _target_: src.common.components.training_loop_functions.scale_loss_by_world_size_for_initialization_training_loop
  _partial_: true

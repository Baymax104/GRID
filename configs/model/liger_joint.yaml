# @package _global_
defaults:
- liger@_here_
- _self_
root:
  _target_: src.recommendation.liger.joint_mixture.JointMixtureLiger
  candidate_strategy: probability_mixture
  content_mixture_alpha: 0.5
  content_only: false
  mechanism_control: learned_mass
  inference_mixture_alpha: null
training_model_config:
  scheduler:
    warmup_steps: 2500
metrics:
  stages:
    train:
      mixture_loss:
        metric:
          _target_: torchmetrics.MeanMetric
        spec:
          key: mixture_loss
      mixture_alpha:
        metric:
          _target_: torchmetrics.MeanMetric
        spec:
          key: mixture_alpha
    val:
      mixture_loss:
        metric:
          _target_: torchmetrics.MeanMetric
        spec:
          key: mixture_loss
      mixture_alpha:
        metric:
          _target_: torchmetrics.MeanMetric
        spec:
          key: mixture_alpha
